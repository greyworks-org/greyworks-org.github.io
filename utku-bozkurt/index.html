      ce("button",{className:"tab-btn"+(tab==="chat"?" active":""),onClick:function(){setTab("chat")}},"Chat"),
      ce("button",{className:"tab-btn"+(tab==="about"?" active":""),onClick:function(){setTab("about")}},"Brief")
    )
  ),

  // Messages
  ce("div",{className:"chat-messages"},
    msgs.length===0?
    ce("div",{className:"chat-empty"},
      ce("div",{className:"chat-empty-inner"},
        ce("h2",null,"Ask Utku about strategy, GTM, or role fit"),
        ce("p",null,"CSO & Head of BD at WASK. Previously founded and scaled njoyKidz to 500K+ downloads and $5M valuation. SaaS, AdTech, AI product strategy.")
      )
    )
    :
    ce(React.Fragment,null,
      msgs.map(function(m,i){
        return ce("div",{key:i,className:"msg-row"+(m.role==="user"?" user":"")},
          ce("div",{className:"msg-bubble "+(m.role==="user"?"user":"assistant")},m.content)
        );
      }),
      loading&&ce("div",{className:"msg-row"},
        ce("div",{className:"loading-dots"},
          ce("div",null),ce("div",null),ce("div",null)
        )
      ),
      ce("div",{ref:endRef})
    )
  ),

  // Input
  ce("div",{className:"chat-input-bar"},
    ce("div",{className:"input-wrap"},
      ce("textarea",{value:input,onChange:function(e){setInput(e.target.value)},onKeyDown:function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input)}},placeholder:"Ask about strategy, leadership, or role fit...",disabled:!apiOk,rows:1,onInput:function(e){e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,80)+"px"}}),
      ce("button",{className:"send-btn",onClick:function(){send(input)},disabled:loading||!input.trim()||!apiOk},"\u2191")
    )
  )
);

// ===== BRIEF CONTENT (shared between desktop panel and mobile tab) =====
function BriefContent(){
  return ce("div",{className:"brief-content"},
    ce("div",{className:"photo-wrap"},
      ce("img",{src:PHOTO,alt:"Utku Bozkurt"})
    ),
    ce("span",{className:"badge"},"Recruiter brief"),
    ce("h2",null,"Utku ",ce("em",null,"Bozkurt")),
    ce("p",{className:"tagline"},"SaaS and AdTech strategist with 6+ years across business development, product strategy, fundraising, and growth. Currently leading strategy and BD at WASK serving 7,000+ subscribers in 130+ countries. Previously founded and scaled a consumer gaming platform to $5M valuation."),
    ce("div",{className:"contact-row"},contactItems.map(function(item,idx){return renderContact(item,"brief-cta-"+idx,false)})),

    // Snapshot
    ce("div",{className:"snapshot"},
      ce("h3",null,"Quick recruiter snapshot"),
      ce("div",{className:"snapshot-grid"},recruiterSnapshot.map(function(item,idx){
        return ce("div",{key:idx,className:"snapshot-card"},
          ce("div",{className:"label"},item[0]),
          ce("div",{className:"value"},item[1])
        );
      }))
    ),

    // Best-fit
    ce("div",{className:"section"},
      ce("h3",null,"Best-fit conversations"),
      ce("div",{className:"tag-cloud"},bestFitRoles.map(function(role,idx){
        return ce("div",{key:idx,className:"tag"},role);
      }))
    ),

    // Career path
    ce("div",{className:"section"},
      ce("h3",null,"Career path"),
      ce(TL,{y:"2024 \u2013 Present",t:"CSO & Head of BD",c:"WASK Inc.",h:"Strategic turnaround, AI products, Series A"}),
      ce(TL,{y:"2021 \u2013 2024",t:"Founder & CEO",c:"njoyKidz",h:"500K+ downloads, $5M valuation"}),
      ce(TL,{y:"2020 \u2013 2023",t:"MSc MIS",c:"Dokuz Eylul University",h:"3.81 GPA, published research"}),
      ce(TL,{y:"2020 \u2013 2021",t:"Business Development",c:"Uraz Patent"})
    ),

    // What he brings
    ce("h3",{style:{fontFamily:"Sora,sans-serif",fontSize:13,fontWeight:700,color:"#00eaff",marginBottom:8}},"What he brings"),
    [
      {t:"Strategic turnarounds",d:"Joined WASK when metrics were declining. Restructured pricing, launched an AI product suite, and realigned GTM. Churned revenue dropped 42% and subscriber growth reached 20% YoY within 12 months."},
      {t:"GTM and growth execution",d:"Built go-to-market strategies across 130+ countries, covering positioning, pricing, demand capture, pipeline management, and commercial execution."},
      {t:"AI product and CRM operations",d:"Scoped and launched WASK's AI suite. Strong operating range across HubSpot, pipeline design, marketing automation, and business-to-technical translation."},
      {t:"Founder perspective",d:"Built njoyKidz from thesis idea to 500K+ users, $525K raised, and a 20-person team. Brings founder empathy with operator discipline."}
    ].map(function(x,i){
      return ce("div",{key:i,className:"val-card"},
        ce("div",{className:"val-title"},x.t),
        ce("div",{className:"val-desc"},x.d)
      );
    }),

    // Recognition
    ce("h3",{style:{fontFamily:"Sora,sans-serif",fontSize:13,fontWeight:700,color:"#00eaff",marginBottom:8,marginTop:20}},"Recognition"),
    ce("div",{style:{marginBottom:20}},
      ["Google Jury Member, Game & App Academy (2023 & 2024)","Published researcher, International MIS Conference (2023)","Quoted as industry expert in Bloomberg Businessweek","Panelist, Private Equity & Advisors Academy, Bogazici University","Speaker at HIT Games Conference and Show Turk TV","Mentored 60+ students across two cohorts"]
      .map(function(r,i){return ce("div",{key:i,className:"recognition-item"},r)})
    ),

    // CV download
    ce("button",{onClick:dlCV,className:"cv-btn"},
      ce("span",{dangerouslySetInnerHTML:{__html:cvSvg}}),
      ce("span",null,"Download quick CV")
    ),

    // Direct outreach
    ce("div",{className:"outreach-box"},
      ce("h3",null,"Direct outreach"),
      ce("div",{className:"sub"},"Best for live recruiter conversations, scheduling, and fit discussions."),
      ce("div",{className:"contact-row"},contactItems.map(function(item,idx){return renderContact(item,"footer-cta-"+idx,true)}))
    )
  );
}

// ===== LAYOUT =====
if(isMob){
  // Mobile: tab-based switching
  return ce("div",{style:{height:"100vh",display:"flex",flexDirection:"column"}},
    tab==="chat"?chatPanel:ce("div",{style:{flex:1,overflowY:"auto"}},ce(BriefContent))
  );
}

// Desktop: side-by-side
return ce("div",{className:"desktop-layout"},
  chatPanel,
  ce("div",{className:"brief-panel"},ce(BriefContent))
);
}

ReactDOM.render(ce(App),document.getElementById("root"));
</script>
</body>
</html>
